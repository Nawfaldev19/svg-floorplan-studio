name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Mention keyboard and screen-reader use if the change affects interaction.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Check docs/explanation/scope.md for non-goals (for example servers, accounts or collaboration) before proposing them.
