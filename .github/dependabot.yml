# Weekly dependency updates. Minor and patch updates are grouped into one pull
# request per ecosystem; new releases wait 14 days before they are proposed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
